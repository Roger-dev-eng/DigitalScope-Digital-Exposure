[project]
name = "digitalscope-cloudflare"
version = "0.1.0"
description = "DigitalScope on Cloudflare Workers"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "email-validator==2.2.0",
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
